site_name: Brandur's blog
site_url: https://brandurjacobsen.github.io
repo_url: https://github.com/brandurjacobsen/brandurjacobsen.github.io

theme:
  name: material

docs_dir: mkdocs
site_dir: docs # Github pages wants '/' or '/docs' to serve content

plugins:
  - search
  - blog

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
